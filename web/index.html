<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Pelacak keuangan rumah tangga keluarga Indonesia.">
  <meta name="theme-color" content="#F1EDE4">

  <!-- iOS PWA: lets Safari "Add to Home Screen" run standalone -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FinSist">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FinSist</title>
  <link rel="manifest" href="manifest.json">

  <!-- PWA install bridge: capture beforeinstallprompt before Flutter boots,
       expose a tiny API for Dart to read state + trigger the install dialog. -->
  <script>
    (function () {
      var deferred = null;
      var installed = false;
      function isStandalone() {
        return (window.matchMedia &&
                window.matchMedia('(display-mode: standalone)').matches) ||
               window.navigator.standalone === true;
      }
      function isIOS() {
        var ua = window.navigator.userAgent || '';
        return /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
      });
      window.addEventListener('appinstalled', function () {
        installed = true;
        deferred = null;
      });
      window.ftPwa = {
        canPrompt: function () { return !!deferred && !isStandalone() && !installed; },
        needsIosInstructions: function () { return isIOS() && !isStandalone() && !installed; },
        isStandalone: isStandalone,
        prompt: function () {
          if (!deferred) return Promise.resolve(false);
          var d = deferred;
          deferred = null;
          d.prompt();
          return d.userChoice.then(function (c) { return c.outcome === 'accepted'; });
        }
      };
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
