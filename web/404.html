<!DOCTYPE html>
<!-- Presence of this file switches Cloudflare Pages off SPA-fallback mode:
     unknown paths get a real 404 instead of the app HTML with status 200
     (soft-404s). Safe because the app uses hash routing — every real app URL
     is "/" plus a #/fragment, so the server never resolves deep paths. -->
<html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Halaman tidak ditemukan — FinSist</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=2">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #F1EDE4;
      font: 16px/1.6 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: #3d3a31;
      text-align: center;
    }
    main { padding: 24px; }
    a { color: #3d3a31; }
  </style>
</head><body>
  <main>
    <h1>404 — Halaman tidak ditemukan</h1>
    <p>Alamat ini tidak ada. <a href="/">Kembali ke FinSist</a></p>
  </main>
</body></html>
