name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  emulator:
    name: Firestore rules emulator
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: emulator_tests/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install firebase-tools
        run: npm i -g firebase-tools

      - name: npm install (emulator_tests)
        run: cd emulator_tests && npm ci

      - name: Run rules tests against Firestore emulator
        run: firebase emulators:exec --only firestore --project demo-ft "cd emulator_tests && npm test"

  android:
    name: Android APK (release, unsigned)
    needs: [test, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # SEC-007: decode the upload keystore + drop key.properties so the
      # release APK is signed with the production key. Skip silently on PRs
      # from forks where the secrets aren't exposed (build then falls back
      # to debug signing + warns loudly via build.gradle.kts).
      - name: Set up release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPS: ${{ secrets.ANDROID_KEY_PROPS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' "$ANDROID_KEY_PROPS" > android/key.properties

      # Build per-ABI split APKs (smaller download per device). Output ends up
      # in build/app/outputs/flutter-apk/.
      - name: flutter build apk --split-per-abi
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: finsist-apks-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # Also publish APKs to a GitHub Release when a v* tag is pushed.
      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true

  web:
    name: Web build + Cloudflare Pages deploy
    needs: [test, emulator]
    runs-on: ubuntu-latest
    # Push to main → production. PR from same repo → preview URL (skip forks,
    # since secrets aren't exposed to them).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Resolve app version
        id: ver
        run: echo "v=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build web
        run: |
          flutter build web --release \
            --dart-define=APP_VERSION=${{ steps.ver.outputs.v }} \
            --dart-define=FT_RECAPTCHA_V3_SITE_KEY=${{ secrets.RECAPTCHA_V3_SITE_KEY }}

      # Flutter web build doesn't copy arbitrary root files from web/ into
      # build/web/. _headers carries the CSP + nosniff + Referrer + Permissions
      # policies Cloudflare Pages serves alongside every response (SEC-006).
      - name: Copy Cloudflare Pages _headers
        run: cp web/_headers build/web/_headers

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=finsist --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
